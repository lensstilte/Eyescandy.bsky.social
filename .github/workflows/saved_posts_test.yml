name: EyesCandy Saved Posts Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eyescandy-saved-posts-test
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      SAVED_POSTS_USERNAME: ${{ secrets.SAVED_POSTS_USERNAME }}
      SAVED_POSTS_PASSWORD: ${{ secrets.SAVED_POSTS_PASSWORD }}
      BSKY_USERNAME: ${{ secrets.BSKY_USERNAME_EYESCANDY }}
      BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD_EYESCANDY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install atproto

      - name: Run Saved Posts Test
        run: python saved_posts_test.py