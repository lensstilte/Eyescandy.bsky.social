name: Saved Posts Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-posts-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install atproto

      - name: Run Saved Posts test
        env:
          SAVED_POSTS_USERNAME: ${{ secrets.SAVED_POSTS_USERNAME }}
          SAVED_POSTS_PASSWORD: ${{ secrets.SAVED_POSTS_PASSWORD }}
          BSKY_USERNAME: ${{ secrets.BSKY_USERNAME }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: python saved_posts_test.py
